<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hydra — Setup Wizard</title>
<link rel="stylesheet" href="css/hydra.css">
<link rel="stylesheet" href="css/shell.css">
<style>
  body { display: grid; grid-template-columns: 360px 1fr; grid-template-rows: 64px 1fr 72px; height: 100vh; overflow: hidden; }
  .seq { grid-row: 1 / 4; display: flex; flex-direction: column; background: var(--g-black); border-right: 1px solid var(--black-700); box-shadow: inset -1px 0 0 rgba(179,23,47,.35); }
  .seq .head { padding: 18px 20px 14px; border-bottom: 1px solid var(--black-700); }
  .seq .head h2 { font-family: var(--serif); font-size: 24px; font-weight: 500; margin: 4px 0 10px; }
  .steps { flex: 1; overflow-y: auto; padding: 10px; }
  .st { display: flex; align-items: center; gap: 12px; padding: 6px 12px; border-radius: var(--r); cursor: pointer; margin-bottom: 1px; }
  .st:hover { background: var(--black-700); }
  .st .n { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--black-650); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: var(--text-2); flex: none; background: var(--black-800); }
  .st .n svg { width: 14px; height: 14px; }
  .st b { display: block; font-weight: 500; font-size: 13.5px; line-height: 1.3; } .st small { color: var(--text-3); font-size: 11.5px; }
  .st.done .n { background: var(--ok-bg); border-color: rgba(47,158,116,.5); color: var(--ok); }
  .st.later { opacity: .55; }
  .st.later .soon { margin-left: auto; font-size: 10px; color: var(--text-3); border: 1px solid var(--black-650); border-radius: 3px; padding: 1px 5px; white-space: nowrap; }
  .st.on { background: var(--g-cherry); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); opacity: 1; }
  .st.on .n { background: #fff; color: var(--cherry-600); border-color: #fff; font-weight: 700; }
  .st.on small { color: rgba(255,255,255,.75); }
  .seq .foot { padding: 12px 20px; border-top: 1px solid var(--black-700); font-family: var(--mono); font-size: 11px; color: var(--text-3); display: flex; gap: 8px; align-items: center; }
  .top { grid-column: 2; }
  .content { grid-column: 2; overflow-y: auto; padding: 28px 36px 30px; }
  .content .inner { max-width: 980px; }
  .navbar { grid-column: 2; display: flex; align-items: center; gap: 12px; padding: 0 36px; background: var(--black-900); border-top: 1px solid var(--black-700); }
  .browser-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .bcard { padding: 14px; border-radius: var(--r); border: 1px solid var(--black-650); background: var(--black-800); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .bcard b { font-size: 14px; } .bcard small { color: var(--text-3); }
  .bcard.on { border-color: var(--cherry-400); box-shadow: 0 0 0 3px rgba(212,42,69,.2); background: linear-gradient(180deg, rgba(179,23,47,.12), var(--black-800)); }
  .result { margin-top: 4px; }
  .tree { font-family: var(--mono); font-size: 12px; color: var(--text-2); line-height: 1.8; white-space: pre; background: var(--black-900); border: 1px solid var(--black-700); border-radius: var(--r); padding: 14px 18px; }
  .welcome-grid { display: grid; grid-template-columns: 220px 1fr; gap: 32px; align-items: center; }
  .welcome-grid img { width: 220px; }
  .sumrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--black-700); }
  .sumrow svg { width: 18px; height: 18px; } .sumrow.ok svg { color: var(--ok); } .sumrow.todo svg { color: var(--warn); } .sumrow.later svg { color: var(--mercury-500); }
  .sumrow .d { color: var(--text-2); margin-left: auto; text-align: right; }
</style>
</head>
<body>
  <aside class="seq">
    <div class="head">
      <div class="row"><span class="overline">Setup Wizard</span><span class="spacer"></span><span class="chip cherry" id="stage">Step 1 / 13</span></div>
      <h2>Configure Hydra</h2>
      <div class="bar"><i id="seqbar"></i></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="foot"><span class="dot"></span><span id="seqfoot">Required now: SFA, Page URLs, Save Location</span></div>
  </aside>

  <header class="top">
    <span class="crumb">HYDRA<i>/</i><b>Setup Wizard</b></span>
    <span class="spacer"></span>
    <span class="chip" id="userchip"></span>
    <button class="btn btn-ghost btn-sm hidden" id="exit" style="color:#fff;border-color:rgba(255,255,255,.4)">Exit wizard</button>
  </header>

  <main class="content"><div class="inner" id="content"></div></main>

  <footer class="navbar">
    <button class="btn btn-dark" id="back"><span data-icon="back"></span>Back</button>
    <span class="faint" id="navhint"></span>
    <span class="spacer"></span>
    <button class="btn btn-primary btn-lg" id="next">Next <span data-icon="arrow"></span></button>
  </footer>

<script src="js/bridge.js"></script>
<script src="js/wizard.js"></script>
</body>
</html>
