<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hydra</title>
<link rel="stylesheet" href="css/hydra.css">
<style>
  body { overflow: hidden; background: radial-gradient(110% 85% at 50% 28%, #1C1D21 0%, #121417 45%, #0B0C0E 100%); }
  body::before { content: ""; position: fixed; inset: 0; background: var(--brushed); pointer-events: none; }
  .corner { position: fixed; width: 44px; height: 44px; border: 2px solid rgba(203,210,217,.35); }
  .corner.tl { top: 22px; left: 22px; border-right: 0; border-bottom: 0; }
  .corner.tr { top: 22px; right: 22px; border-left: 0; border-bottom: 0; }
  .corner.bl { bottom: 50px; left: 22px; border-right: 0; border-top: 0; }
  .corner.br { bottom: 50px; right: 22px; border-left: 0; border-top: 0; }
  .center { position: absolute; inset: 0 0 32px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .emblem { position: relative; width: 300px; height: 300px; }
  .emblem::before { content: ""; position: absolute; inset: -70px; border-radius: 50%; background: radial-gradient(circle, rgba(179,23,47,.32) 0%, rgba(179,23,47,.08) 45%, transparent 70%); animation: glow 4s ease-in-out infinite; }
  .emblem .disc { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #1B1D24, #0B0C0E 75%); box-shadow: 0 0 0 6px rgba(90,12,24,.55), 0 0 0 7px rgba(203,210,217,.18), 0 30px 60px -20px #000; }
  .emblem img { position: absolute; inset: 10px; width: calc(100% - 20px); }
  .emblem .sheen { position: absolute; inset: 0; border-radius: 50%; overflow: hidden; }
  .emblem .sheen::after { content: ""; position: absolute; top: -50%; left: -60%; width: 40%; height: 200%; transform: rotate(25deg); background: linear-gradient(90deg, transparent, rgba(255,255,255,.10), transparent); animation: sheen 5.5s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  @keyframes glow { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
  h1.wordmark { font-size: 76px; margin: 36px 0 6px; padding-left: .32em; }
  .tag { letter-spacing: .5em; font-size: 15px; color: var(--mercury-300); padding-left: .5em; }
  .pill { margin-top: 18px; display: inline-flex; align-items: center; gap: 10px; padding: 7px 16px; border-radius: 999px; border: 1px solid var(--black-650); background: rgba(11,12,14,.7); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--text-2); }
  .progress { width: 560px; margin-top: 46px; }
  .progress .bar { height: 3px; }
  .status { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; font-family: var(--mono); font-size: 13px; color: var(--text-2); min-height: 38px; }
  .status .pct { margin-left: auto; color: var(--text); font-weight: 500; }
  .steps { width: 560px; margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; font-size: 12px; transition: opacity .3s; }
  .steps .s { display: flex; align-items: center; gap: 8px; color: var(--text-3); min-width: 0; }
  .steps .s span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .steps .s svg, .steps .s .spinner { width: 13px; height: 13px; flex: none; }
  .steps .s.ok { color: var(--text-2); } .steps .s.ok svg { color: var(--ok); }
  .steps .s.warning svg, .steps .s.error svg { color: var(--warn); } .steps .s.warning, .steps .s.error { color: #E8C98A; }
  .steps .s.running { color: var(--text); }
  .steps .s.skipped svg { color: var(--mercury-500); }
  .actions { margin-top: 18px; display: flex; gap: 10px; min-height: 36px; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; height: 32px; display: flex; align-items: center; gap: 14px; padding: 0 22px; border-top: 1px solid var(--black-700); background: rgba(11,12,14,.85); font-family: var(--mono); font-size: 11.5px; color: var(--text-3); }
  .fatal { width: 560px; margin-top: 18px; }
</style>
</head>
<body>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <div class="center">
    <div class="emblem"><div class="disc"></div><img src="assets/img/hydra_logo_silver.png" alt="Hydra"><div class="sheen"></div></div>
    <h1 class="wordmark">HYDRA</h1>
    <div class="tag">MANAGEMENT REPORT AUTOMATION</div>
    <div class="pill"><span class="dot pulse"></span>Lakmee Exports Lanka — SFA Report System</div>

    <div class="progress">
      <div class="bar"><i id="bar"></i></div>
      <div class="status"><span class="dot pulse" id="sdot" style="margin-top:6px"></span><span id="msg">Starting Hydra…</span><span class="pct" id="pct">0%</span></div>
    </div>
    <div class="steps" id="steps"></div>
    <div class="fatal hidden" id="fatal"></div>
    <div class="actions" id="actions"></div>
  </div>

  <div class="footer">
    <span id="ver">Hydra</span><span>·</span><span id="mode">Windows desktop</span>
    <span class="spacer"></span><span id="foot-right"></span>
  </div>

<script src="js/bridge.js"></script>
<script src="js/splash.js"></script>
</body>
</html>
